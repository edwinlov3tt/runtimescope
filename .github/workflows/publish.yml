name: Publish to npm

# Publishes the JS/TS packages on a v* tag. Post-M7 the collector, mcp-server,
# and CLI are Rust binaries (shipped via release-binaries.yml, NOT npm — see tag
# node-reference-v0.10.13 for the final Node versions). The dashboard ships
# embedded in the Rust binary. This workflow now publishes only the SDKs and the
# framework integrations. The Rust wire-contract gate lives in rust.yml.
on:
  push:
    tags:
      - 'v*' # Triggered by: git tag v0.11.0 && git push --tags
  workflow_dispatch: # manual re-run (e.g. after a CI fix) without moving the tag

jobs:
  publish:
    # macos-14 (NOT ubuntu): the committed lockfile is generated on macOS (where
    # the Rust gate runs), so its rollup native optional dep is the darwin one. On
    # ubuntu, `npm ci` can't find @rollup/rollup-linux-x64-gnu (npm/cli#4828) and
    # the tsup/rollup build fails. Matching the runner to the lock keeps `npm ci`
    # deterministic; the published SDK artifacts are platform-independent JS.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci
      # SDKs first — the framework integrations import @runtimescope/sdk types.
      - run: npm run build -w packages/sdk -w packages/server-sdk -w packages/workers-sdk
      - run: npm run build -w packages/nextjs -w packages/remix -w packages/sveltekit -w packages/vite
      - run: npm test

      # Publish in dependency order (|| true skips already-published versions).
      - run: npm publish -w packages/sdk --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm publish -w packages/server-sdk --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm publish -w packages/workers-sdk --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm publish -w packages/nextjs --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm publish -w packages/remix --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm publish -w packages/sveltekit --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm publish -w packages/vite --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
