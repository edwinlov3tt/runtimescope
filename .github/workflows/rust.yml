name: Rust

# Build + lint + test the Rust collector workspace, then run the M7 release
# gates against the built binaries:
#   - conformance (ADR-0006 wire contract) via RUNTIMESCOPE_COLLECTOR_CMD +
#     RUNTIMESCOPE_MCP_CMD — the parity gate, run serial (--no-file-parallelism)
#     to avoid the known harness port-collision flake.
#   - bench:compare — the perf gate: Node baseline vs the Rust candidate on the
#     SAME runner (the >=90% throughput / <=1.25x RSS ratios are relative, so
#     runner speed cancels out).
# Runs on macos-14 (arm64) to match rust-toolchain.toml's darwin targets.
on:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tests/conformance/**'
      - 'stress/**'
      - 'packages/collector/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/conformance/**'
      - 'stress/**'
      - 'packages/collector/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain (from rust-toolchain.toml)
        run: rustup show && cargo --version
      - name: Build
        run: cargo build --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # Parity gate: the Rust binaries must pass the full wire-contract suite that
  # the Node reference passes. Runs serial to dodge the port-collision flake.
  conformance:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JS deps (conformance harness)
        run: npm ci
      # The Rust binary embeds the dashboard SPA (rust-embed, compile-time), and
      # the dashboard-embed conformance spec asserts the REAL SPA is served — so
      # build it BEFORE cargo. sdk -> dashboard (dashboard imports @runtimescope/sdk).
      - name: Build dashboard SPA (embedded into the binary)
        run: |
          npm run build -w packages/sdk
          npm run build -w packages/dashboard
      - name: Build Rust binaries (release)
        run: cargo build --release --locked --bin collector-server --bin mcp-server
      - name: Conformance vs Rust (serial)
        env:
          RUNTIMESCOPE_COLLECTOR_CMD: ${{ github.workspace }}/target/release/collector-server
          RUNTIMESCOPE_MCP_CMD: ${{ github.workspace }}/target/release/mcp-server
        run: npx vitest run --config tests/conformance/vitest.config.ts --no-file-parallelism

  # Perf gate: bench the Rust collector and assert absolute SLOs. Post-M7 the
  # Node reference is gone (tag node-reference-v0.10.13), so there's no live
  # baseline to ratio against — we gate on absolute floors/ceilings instead (the
  # Node comparison that justified the cutover is in reviews/0003). Skipped on
  # feature-branch pushes (timing-sensitive); runs on PRs, main, manual dispatch.
  bench:
    runs-on: macos-14
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JS deps
        run: npm ci
      - name: Build Rust collector (release)
        run: cargo build --release --locked --bin collector-server
      - name: Bench Rust
        env:
          RUNTIMESCOPE_COLLECTOR_CMD: ${{ github.workspace }}/target/release/collector-server
        run: npm run bench
      - name: SLO check (gate)
        run: |
          RUST_REPORT=$(ls -t bench/results/collector-server-*.json | head -1)
          echo "report: $RUST_REPORT"
          npm run bench:check -- "$RUST_REPORT"
