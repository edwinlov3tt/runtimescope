# Cargo workspace for the Rust collector (Phase Rust-Collector, v0.11.0).
# The npm workspace lives alongside under packages/ — excluded here so the
# Tauri tray (packages/tray/src-tauri) keeps its own independent Cargo setup.
[workspace]
resolver = "2"
members = [
    "crates/collector-core",
    "crates/collector-server",
    "crates/mcp-server",
    "crates/cli",
]
exclude = ["packages"]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "io-std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
