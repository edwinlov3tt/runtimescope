[package]
name = "runtimescope-mcp"
description = "RuntimeScope MCP server — runtime monitoring tools over MCP with an embedded collector (library; the `runtimescope` crate ships the binary)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
collector-core = { package = "runtimescope-core", path = "../collector-core", version = "0.11.2" }
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
tokio.workspace = true
serde = { workspace = true }
serde_json.workspace = true
schemars = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
