# Production docker-compose with Caddy reverse proxy for automatic HTTPS/WSS
# Use this for self-hosted VPS deployments (Hetzner, Linode, DigitalOcean Droplet, etc.)
#
# Setup:
#   1. Point your domain (e.g., runtimescope.yourcompany.com) to the server's IP
#   2. Edit deploy/Caddyfile and replace `runtimescope.example.com` with your domain
#   3. Generate a secure auth token:  openssl rand -hex 32
#   4. Set AUTH_TOKEN in .env (see deploy/.env.example) or pass via -e
#   5. Run: docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
#
# Your DSN becomes (TLS, port 443 via Caddy — note the explicit :443 so the SDK
# does not fall back to the dev ports; see deploy/README.md):
#   runtimescopes://proj_xxx:<AUTH_TOKEN>@runtimescope.yourcompany.com:443
#
# Alternative (no open ports, free TLS, SSO on the dashboard): the droplet +
# Cloudflare Tunnel runbook — deploy/droplet-cloudflared.md.

services:
  collector:
    image: runtimescope/collector:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "6767"   # WebSocket (internal — Caddy proxies)
      - "6768"   # HTTP API + dashboard (internal — Caddy proxies)
    volumes:
      - runtimescope-data:/home/runtimescope/.runtimescope
    environment:
      # 0.0.0.0 so Caddy (a separate container) can reach the collector over the
      # docker network. Honored by the Rust collector via RUNTIMESCOPE_HOST
      # (ADR-0010). Never expose these ports directly — only Caddy is published.
      - RUNTIMESCOPE_HOST=0.0.0.0
      - RUNTIMESCOPE_PORT=6767
      - RUNTIMESCOPE_HTTP_PORT=6768
      - RUNTIMESCOPE_BUFFER_SIZE=10000
      # Analytics long windows (12mo / 53-week cohorts) need retention ≥ the window;
      # bump this if you rely on them (default 30d truncates them silently).
      - RUNTIMESCOPE_RETENTION_DAYS=${RETENTION_DAYS:-30}
      - RUNTIMESCOPE_AUTH_TOKEN=${AUTH_TOKEN:?AUTH_TOKEN is required — set it in .env or env var}
      # Analytics admin de-anon (slice 6): empty ⇒ the PII path stays CLOSED.
      - RUNTIMESCOPE_ADMIN_KEY=${ADMIN_KEY:-}
      # Uptime probe (slice 5): default-deny private IPs (SSRF). Set 1 only to probe
      # apps on a trusted private network.
      - RUNTIMESCOPE_UPTIME_ALLOW_PRIVATE=${UPTIME_ALLOW_PRIVATE:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6768/readyz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - rs-internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - collector
    networks:
      - rs-internal

networks:
  rs-internal:
    driver: bridge

volumes:
  runtimescope-data:
  caddy-data:
  caddy-config:
